<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 280px; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; background: #111318; color: #e8e9ec; }
  .wrap { padding: 14px 16px; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; }
  .ok { color: #3ba55d; } .bad { color: #ed4245; } .muted { color: #9a9ca3; }
  .game { margin-top: 10px; padding: 10px; border-radius: 8px; background: #1c1f26; }
  .game b { display: block; }
  .hint { margin-top: 10px; font-size: 12px; color: #9a9ca3; }
  .hint:empty { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>NHL-RPC</h1>
  <div class="row"><span>App</span><span id="app" class="muted">…</span></div>
  <div class="row"><span>Discord</span><span id="discord" class="muted">…</span></div>
  <div id="game" class="game muted">No game detected. Click a stream link on onhockey.tv.</div>
  <div id="hint" class="hint"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
